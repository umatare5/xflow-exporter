# .goreleaser.yml for xflow-exporter

project_name: xflow-exporter
version: 2

# Distribution directory
dist: tmp/dist

# Build destination
github_urls:
  # set to true if you use a self-signed certificate
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: cmd/main.go
    id: xflow-exporter
    binary: xflow-exporter
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'github.com/umatare5/xflow-exporter/internal/cli.version={{ .Version }}'
    hooks:
      post:
        # The setting is recorded in the binary, so this fails the release if cgo returns
        - cmd: grep -q CGO_ENABLED=0 {{ .Path }}

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/*.md"
      - "examples/*.yml"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
    format_overrides:
      - goos: windows
        formats: ["zip"]

# Docker configuration
dockers:
  - image_templates:
      - "ghcr.io/umatare5/xflow-exporter:latest-amd64"
      - "ghcr.io/umatare5/xflow-exporter:{{ .Tag }}-amd64"
      - "ghcr.io/umatare5/xflow-exporter:v{{ .Major }}.{{ .Minor }}-amd64"
    # A prerelease must not move latest or the minor tag, and release.prerelease reaches
    # only the GitHub release
    skip_push: auto
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Prometheus Exporter for NetFlow, IPFIX and sFlow"
      - "--label=org.opencontainers.image.url=https://github.com/umatare5/xflow-exporter"
      - "--label=org.opencontainers.image.source=https://github.com/umatare5/xflow-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    goarch: amd64
    ids:
      - xflow-exporter
    extra_files:
      - "LICENSE"
      - "NOTICE"
  - image_templates:
      - "ghcr.io/umatare5/xflow-exporter:latest-arm64"
      - "ghcr.io/umatare5/xflow-exporter:{{ .Tag }}-arm64"
      - "ghcr.io/umatare5/xflow-exporter:v{{ .Major }}.{{ .Minor }}-arm64"
    skip_push: auto
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Prometheus Exporter for NetFlow, IPFIX and sFlow"
      - "--label=org.opencontainers.image.url=https://github.com/umatare5/xflow-exporter"
      - "--label=org.opencontainers.image.source=https://github.com/umatare5/xflow-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    goarch: arm64
    ids:
      - xflow-exporter
    extra_files:
      - "LICENSE"
      - "NOTICE"

# Docker manifest for multi-platform images
docker_manifests:
  # The manifest step is gated separately from the image push, so it needs its own auto
  - name_template: "ghcr.io/umatare5/xflow-exporter:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/umatare5/xflow-exporter:latest-amd64"
      - "ghcr.io/umatare5/xflow-exporter:latest-arm64"
  - name_template: "ghcr.io/umatare5/xflow-exporter:{{ .Tag }}"
    skip_push: auto
    image_templates:
      - "ghcr.io/umatare5/xflow-exporter:{{ .Tag }}-amd64"
      - "ghcr.io/umatare5/xflow-exporter:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/umatare5/xflow-exporter:v{{ .Major }}.{{ .Minor }}"
    skip_push: auto
    image_templates:
      - "ghcr.io/umatare5/xflow-exporter:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/umatare5/xflow-exporter:v{{ .Major }}.{{ .Minor }}-arm64"

release:
  prerelease: auto
  draft: true
  replace_existing_draft: true
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    This release contains the Prometheus Exporter for NetFlow, IPFIX and sFlow.

    > [!IMPORTANT]
    > A minor release may rename or remove a metric. Read the [CHANGELOG](https://github.com/umatare5/xflow-exporter/blob/{{ .Tag }}/CHANGELOG.md) before upgrading.

    ### 🐳 Container Images

    ```bash
    # Latest version
    docker run --rm ghcr.io/umatare5/xflow-exporter:latest --help

    # Specific version
    docker run --rm ghcr.io/umatare5/xflow-exporter:{{ .Tag }} --help

    # With the default ports published
    docker run --rm -p 10052:10052 -p 2055:2055/udp ghcr.io/umatare5/xflow-exporter:{{ .Tag }}
    ```

    ### 📦 Binary Installation

    Download a prebuilt binary for your platform from the release assets below.

  footer: |
    **Full Changelog**: https://github.com/umatare5/xflow-exporter/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 📚 Documentation

    - [README](https://github.com/umatare5/xflow-exporter/blob/{{ .Tag }}/README.md)
    - [CHANGELOG](https://github.com/umatare5/xflow-exporter/blob/{{ .Tag }}/CHANGELOG.md)
    - [Container Registry](https://github.com/umatare5/xflow-exporter/pkgs/container/xflow-exporter)

# Generate checksums for source archives
checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge branch "
      - "^release:"
      - "^ci:"
      - "^test:"

# Metadata for Go proxy and pkg.go.dev
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
