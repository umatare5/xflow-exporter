# Air configuration for xflow-exporter CLI development
# Documentation: https://github.com/air-verse/air

tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/xflow-exporter ./cmd/main.go"
  full_bin = 'tmp/xflow-exporter \
                  --collector.exporters \
                  --collector.hosts \
                  --collector.services \
                  --collector.asns \
                  --collector.applications \
                  --collector.distributions'

  exclude_dir = ["assets", "tmp", "vendor", "test_data", ".git", ".github", ".vscode", "node_modules", "dist", "build"]
  exclude_regex = ["_test\\.go"]

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[screen]
  keep_scroll = true
