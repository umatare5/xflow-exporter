---
# A firing case is asserted through the ALERTS series the rule under test
# produces, because exp_alerts also compares exp_annotations and would copy
# each rule's description into this file.
rule_files:
  - prometheus_alert_rules.yml

evaluation_interval: 1m

tests:
  # The timestamp freezes at t=0; the threshold is crossed at 15m. keep the
  # silent edge at 14m and assert firing at 16m.
  - interval: 1m
    input_series:
      - series: 'xflow_last_flow_timestamp_seconds{job="xflow",instance="localhost:10040",exporter="192.0.2.1"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: XflowExporterSilent
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="XflowExporterSilent"}
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="XflowExporterSilent", alertstate="firing", exporter="192.0.2.1", instance="localhost:10040", job="xflow", severity="warning"}'
            value: 1

  # for: 5m puts the firing edge past 5m of a sustained increase; a flat
  # counter must stay silent.
  - interval: 1m
    input_series:
      - series: 'xflow_receiver_dropped_packets_total{job="xflow",instance="localhost:10040",listener=":2055",reason="queue_full"}'
        values: "0+0x5 0+10x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: XflowReceiverDropping
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="XflowReceiverDropping", alertstate="firing"}
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="XflowReceiverDropping", alertstate="firing", instance="localhost:10040", job="xflow", listener=":2055", reason="queue_full", severity="warning"}'
            value: 1

  # missing_template is excluded from the general decode alert.
  - interval: 1m
    input_series:
      - series: 'xflow_decode_errors_total{job="xflow",instance="localhost:10040",exporter="192.0.2.1",version="netflow_v9",reason="missing_template"}'
        values: "0+5x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: XflowDecodeErrors
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="XflowTemplatesMissing", alertstate="firing"}
        eval_time: 35m
        exp_samples:
          - labels: 'ALERTS{alertname="XflowTemplatesMissing", alertstate="firing", exporter="192.0.2.1", instance="localhost:10040", job="xflow", reason="missing_template", severity="warning", version="netflow_v9"}'
            value: 1

  - interval: 1m
    input_series:
      - series: 'xflow_decode_errors_total{job="xflow",instance="localhost:10040",exporter="192.0.2.1",version="netflow_v9",reason="malformed"}'
        values: "0+0x2 0+3x15"
    promql_expr_test:
      - expr: ALERTS{alertname="XflowDecodeErrors", alertstate="firing"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="XflowDecodeErrors", alertstate="firing", exporter="192.0.2.1", instance="localhost:10040", job="xflow", reason="malformed", severity="warning", version="netflow_v9"}'
            value: 1

  - interval: 1m
    input_series:
      - series: 'xflow_sequence_missed_total{job="xflow",instance="localhost:10040",exporter="192.0.2.1",odid="256"}'
        values: "0+0x2 0+2x15"
    promql_expr_test:
      - expr: ALERTS{alertname="XflowSequenceLoss", alertstate="firing"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="XflowSequenceLoss", alertstate="firing", exporter="192.0.2.1", instance="localhost:10040", job="xflow", odid="256", severity="warning"}'
            value: 1

  - interval: 1m
    input_series:
      - series: 'xflow_aggregation_overflow_records_total{job="xflow",instance="localhost:10040",aggregation="hosts"}'
        values: "0+0x2 0+50x15"
    promql_expr_test:
      - expr: ALERTS{alertname="XflowAggregationOverflow", alertstate="firing"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="XflowAggregationOverflow", alertstate="firing", aggregation="hosts", instance="localhost:10040", job="xflow", severity="warning"}'
            value: 1
