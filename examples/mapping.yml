# Example mapping file for xflow-exporter's --enrich.mapping-file.
#
# scripts/fetch-device-names.sh writes the devices half from SNMP and
# overwrites this file wholesale, so keep a hand-maintained services block
# somewhere the script does not write to.
devices:
  # The address the device exports from, which is the exporter_address label.
  # An ifIndex the device renumbers is a port this file then misnames, and
  # nothing in the export says the numbering moved: turn on ifIndex
  # persistence (Cisco: snmp-server ifindex persist) before relying on it.
  192.0.2.1:
    # Optional. Without it the device carries no xflow_device_info row.
    hostname: sw1.example.net
    # ifIndex to ifName, joined onto input_ifindex and output_ifindex through
    # xflow_interface_info.
    interfaces:
      1: Vl1
      10102: Gi0/2
      10110: Gi0/10

  # A device may name its ports without naming itself.
  192.0.2.2:
    interfaces:
      1: Vl1

# port/proto to an application name, consulted ahead of the built-in table and
# only where the device named no application itself.
services:
  5246/udp: capwap-control
  5247/udp: capwap-data
  # v0.9.0 dropped these from the built-in table, each naming one product
  # rather than a protocol. Uncomment what this network runs.
  # 3000/tcp: dev-server
  # 3100/tcp: loki
  # 4317/tcp: otlp-grpc
  # 4318/tcp: otlp-http
  # 6443/tcp: kubernetes-api
  # 9090/tcp: prometheus
  # 9092/tcp: kafka
  # 9100/tcp: raw
  # 9115/tcp: blackbox-exporter
  # 9116/tcp: snmp-exporter
  # 9200/tcp: elasticsearch
  # 51820/udp: wireguard
