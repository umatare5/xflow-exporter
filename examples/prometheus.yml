# Example Prometheus configuration for xflow-exporter.
global:
  scrape_interval: 60s
  evaluation_interval: 60s
  # --collector.distributions publishes native histograms, which a scrape
  # negotiates rather than receives by default: without this the exporter's
  # distributions arrive as a _count, a _sum and one +Inf bucket.
  scrape_native_histograms: true

rule_files:
  - prometheus_alert_rules.yml

scrape_configs:
  - job_name: "xflow"
    static_configs:
      - targets: [localhost:10052]

    # Three ways to bound what this exporter costs the reader, from the reader's
    # side alone. They act at different points and only the first one narrows
    # what crosses the wire.
    #
    #   params: name[]           the exporter encodes only the families named,
    #                            so a body of several thousand samples becomes
    #                            a handful. Each family arrives whole, its
    #                            entry-bound fold included.
    #   metric_relabel_configs   drops after the full scrape: selection by
    #                            label, which name[] cannot express.
    #   sample_limit             fails the whole scrape when exceeded, and the
    #                            target reads up == 0: a circuit breaker, not
    #                            a trim.
    #
    # The address-keyed families are where cardinality accumulates:
    # xflow_host_pair_*, xflow_service_*, xflow_destination_* and xflow_threat_*
    # turn their Top-K over as talkers come and go. The dimensional ones --
    # xflow_asn_pair_*, xflow_application_*, xflow_country_pair_*,
    # xflow_tcp_flags_* and xflow_dscp_* -- stay flat, and the self-monitoring
    # families are bounded by the fleet.
    #
    # params:
    #   name[]:
    #     - xflow_build_info
    #     - xflow_flows_total
    #     - xflow_decode_errors_total
    #     - xflow_receiver_dropped_packets_total
    #     - xflow_last_flow_timestamp_seconds
    #     - xflow_sampling_rate
    #     - xflow_asn_pair_packets_total
    #     - xflow_application_packets_total
    #     - xflow_dscp_packets_total
    #
    # metric_relabel_configs:
    #   # Shed the chattiest services and keep the rest. Note what this cannot
    #   # do: it selects by label, never by rank, so the ones to shed have to be
    #   # spelled as a label match rather than as a number.
    #   - source_labels: [__name__, port]
    #     regex: "xflow_service_.*;(137|138|1900|5353)"
    #     action: drop
    #
    # Written as a drop and not a keep on purpose. A keep is evaluated against
    # every sample of the scrape, not against the family it names, so a keep
    # written for one family deletes all the others -- the self-monitoring
    # series every alerting rule here reads included. Nothing reports it: up
    # stays 1, the scrape still succeeds, and the alerts are simply silent from
    # then on.
    #
    # A rule written against the fold will remove it, and so will a keep that
    # merely fails to name it. Every aggregation family carries one series whose
    # labels all read "other", holding what the entry bound rejected at ingest
    # -- the only record of traffic no other series of that family has ever
    # published. A rule matching exporter="other" or src="other" deletes it and
    # leaves every sum() short with nothing in the data to say so.
    #
    # sample_limit: 100000
